listen = *
protocols = imap lmtp
mail_location = maildir:/mail/Maildir
import_environment = FQDN
ssl = required
ssl_cert = </certs/live/%{env:FQDN}/fullchain.pem
ssl_key = </certs/live/%{env:FQDN}/privkey.pem
!include conf.d/*.conf
# Hinweis: Falls die Umgebungsvariable FQDN nicht ausgelesen wird, den Hostnamen direkt eintragen.
